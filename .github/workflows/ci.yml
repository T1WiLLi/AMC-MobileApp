name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build et tests (iOS 26)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Choisir Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios

      - name: Trouver un simulateur iPhone
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=[x for k,v in d.items() if "iOS-26" in k for x in v if x["name"].startswith("iPhone")]; print(c[0]["udid"] if c else "")')
          if [ -z "$UDID" ]; then echo "Aucun simulateur iPhone iOS 26 disponible" >&2; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Cache des paquets Swift et du build
        uses: actions/cache@v4
        with:
          path: |
            SourcePackages
            DerivedData
          key: spm-dd-${{ runner.os }}-${{ hashFiles('AMC-MobileApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-dd-${{ runner.os }}-

      - name: Build et tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project AMC-MobileApp.xcodeproj \
            -scheme AMC-MobileApp \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -parallel-testing-enabled NO \
            -clonedSourcePackagesDirPath SourcePackages \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | grep -E "error:|warning:|Test run|\*\* "
