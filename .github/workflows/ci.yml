name: CI

on:
  pull_request:
    branches: [main]
  # Pas de run au merge sur main : la CI tourne seulement sur les PR.
  # Pour régénérer le cache partagé (après un changement de paquets) : Actions › CI › Run workflow sur main.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Sur main, on laisse finir : c'est la seule exécution qui sauve le cache partagé.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build et tests (iOS 26)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Choisir Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios

      - name: Trouver un simulateur iPhone
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=[x for k,v in d.items() if "iOS-26" in k for x in v if x["name"].startswith("iPhone")]; print(c[0]["udid"] if c else "")')
          if [ -z "$UDID" ]; then echo "Aucun simulateur iPhone iOS 26 disponible" >&2; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          # Démarre le simulateur en arrière-plan pendant la restauration du cache et la compilation.
          nohup xcrun simctl boot "$UDID" >/dev/null 2>&1 &

      - name: Restaurer le cache des paquets Swift et du build
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            SourcePackages
            DerivedData
          key: spm-dd-${{ runner.os }}-${{ hashFiles('AMC-MobileApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-dd-${{ runner.os }}-

      - name: Sonde T-100 — forcer la recompilation de l'app et des tests
        run: rm -rf DerivedData/Build/Intermediates.noindex/AMC-MobileApp.build

      - name: Build et tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project AMC-MobileApp.xcodeproj \
            -scheme AMC-MobileApp \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -parallel-testing-enabled NO \
            -clonedSourcePackagesDirPath SourcePackages \
            -derivedDataPath DerivedData \
            -skipPackageUpdates \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -collect-test-diagnostics never \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            ONLY_ACTIVE_ARCH=YES \
            | tee xcodebuild.log | grep -E "error:|warning:|Test run|\*\* "

      - name: Sauver le cache (main seulement, partagé avec toutes les PR)
        if: always() && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            SourcePackages
            DerivedData
          key: spm-dd-${{ runner.os }}-${{ hashFiles('AMC-MobileApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
