name: CI

# CI éclair (~15 s) : garde le check requis « Build et tests (iOS 26) » pour l'auto-merge,
# sans compiler. Chaque agent compile localement avant de pousser.
# La CI complète (build + tests sur macOS) est dans ci-full.yml, à lancer à la main.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build et tests (iOS 26)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Vérifications rapides
        run: |
          set -e
          # Aucun secret commité.
          if git ls-files | grep -E '(^|/)(\.env|GoogleService-Info\.plist)$'; then
            echo "Secret commité" >&2; exit 1
          fi
          # Aucun marqueur de conflit oublié.
          if git grep -nE '^(<<<<<<<|>>>>>>>)( |$)' -- '*.swift' '*.rules' '*.json' '*.plist' '*.yml'; then
            echo "Marqueur de conflit" >&2; exit 1
          fi
          # Pas de .gitkeep dans l'app (casse le build).
          if git ls-files AMC-MobileApp | grep -q '\.gitkeep$'; then
            echo ".gitkeep dans l'app" >&2; exit 1
          fi
          # Pas de tests de rendu temporaires oubliés.
          if git ls-files AMC-MobileAppTests | grep -E '/Tmp[^/]*\.swift$'; then
            echo "Test temporaire Tmp* oublié" >&2; exit 1
          fi
          echo "OK"
